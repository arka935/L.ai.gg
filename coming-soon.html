<!DOCTYPE html>
<html lang="id">
<head>
<script>
  (function(){
    var t = localStorage.getItem('lai_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Segera Hadir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0d0818; --bg-2:#1f1238; --bg-3:#150e28;
    --violet:#a855f7; --violet-light:#d8b4fe; --glow:rgba(168,85,247,0.45);
    --text-primary:#f7f3fc; --text-muted:#b6a6d1;
    --card-bg:rgba(40,23,64,0.6); --card-border:rgba(192,132,252,0.25);
  }
  [data-theme="light"]{
    --bg-1:#ffffff; --bg-2:#f6f1fc; --bg-3:#ffffff;
    --violet:#7c3aed; --violet-light:#9333ea; --glow:rgba(124,58,237,0.18);
    --text-primary:#1c1330; --text-muted:#6b5d85;
    --card-bg:rgba(255,255,255,0.85); --card-border:rgba(124,58,237,0.15);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, var(--glow), transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    transition: background .4s ease, color .3s ease;
  }
  .icon{
    width:64px; height:64px; border-radius:20px;
    background: var(--glow);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
  }
  .icon svg{ width:28px; height:28px; stroke: var(--violet-light); }
  h1{ font-family:'Sora', sans-serif; font-weight:800; font-size:1.5rem; margin-bottom:10px; }
  p{ color: var(--text-muted); font-size:0.92rem; max-width:320px; line-height:1.55; margin-bottom:26px; }
  a.back{
    font-family:'Sora', sans-serif; font-weight:600; font-size:0.85rem;
    color: var(--text-primary);
    background: var(--card-bg);
    border:1px solid var(--card-border);
    padding:12px 22px; border-radius:14px;
    text-decoration:none;
  }
  a.back:active{ transform: scale(0.97); }
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3M12 22a10 10 0 100-20 10 10 0 000 20z"/></svg>
  </div>
  <h1 id="featTitle">Segera Hadir</h1>
  <p id="featDesc">Fitur ini masih dalam pengembangan. Nantikan update berikutnya di dashboard ya!</p>
  <a class="back" href="index.html">← Kembali ke Dashboard</a>

<script>
  var params = new URLSearchParams(window.location.search);
  var nama = params.get('nama');
  if(nama){
    document.getElementById('featTitle').textContent = nama;
    document.getElementById('featDesc').textContent = nama + ' masih dalam pengembangan. Nantikan update berikutnya di dashboard ya!';
    document.title = nama + ' — Segera Hadir';
  }
</script>
</body>
</html>
