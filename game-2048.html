<!DOCTYPE html>
<html lang="id">
<head>
<script>
  (function(){
    var t = localStorage.getItem('lai_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>2048 — L.ai Game Center</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0d0818; --purple-dark: #1f1238; --purple-mid: #4a2a7a;
    --violet: #a855f7; --violet-light: #d8b4fe; --glow: rgba(168,85,247,0.45);
    --text-primary: #f7f3fc; --text-muted: #b6a6d1;
    --border: rgba(192,132,252,0.22);
    --header-bg: rgba(13,8,24,0.5);
    --surface: rgba(255,255,255,0.05);
  }
  [data-theme="light"]{
    --black: #ffffff; --purple-dark: #f6f1fc; --purple-mid: #e4d4f9;
    --violet: #7c3aed; --violet-light: #9333ea; --glow: rgba(124,58,237,0.16);
    --text-primary: #1c1330; --text-muted: #6b5d85;
    --border: rgba(124,58,237,0.15);
    --header-bg: rgba(255,255,255,0.7);
    --surface: rgba(124,58,237,0.06);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    background:
      radial-gradient(ellipse 80% 50% at 10% -10%, var(--glow), transparent 60%),
      linear-gradient(160deg, var(--black) 0%, var(--purple-dark) 45%, var(--black) 100%);
    min-height:100vh;
    display:flex; flex-direction:column;
    transition: background .4s ease, color .3s ease;
  }
  header{
    display:flex; align-items:center; gap:12px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    backdrop-filter: blur(14px);
    flex-shrink:0;
  }
  .back{
    width:34px; height:34px; border-radius:11px;
    border:1px solid var(--border); background: var(--surface);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted); text-decoration:none; flex-shrink:0;
  }
  .back svg{ width:16px; height:16px; }
  .brand-icon{ height:28px; width:auto; flex-shrink:0; }
  .title{ font-family:'Sora', sans-serif; font-weight:700; font-size:0.95rem; flex:1; }
  .theme-toggle{
    position:relative; width:44px; height:24px; border-radius:999px;
    border:1px solid var(--border); background: var(--surface);
    cursor:pointer; flex-shrink:0; padding:0;
  }
  .theme-toggle svg{ position:absolute; top:50%; width:10px; height:10px; margin-top:-5px; color: var(--text-muted); }
  .theme-toggle .icon-sun{ left:6px; }
  .theme-toggle .icon-moon{ right:6px; }
  .theme-toggle .knob{
    position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%;
    background: linear-gradient(135deg,#a855f7,#7e22ce);
    transition: transform .35s cubic-bezier(.4,0,.2,1), background .35s ease;
  }
  [data-theme="light"] .theme-toggle .knob{ transform: translateX(20px); background: linear-gradient(135deg,#fbbf24,#f59e0b); }

  main{
    flex:1;
    display:flex; flex-direction:column; align-items:center;
    padding: 20px 16px 40px;
    gap:18px;
  }
  .scorebar{ display:flex; gap:12px; width:100%; max-width:360px; }
  .score-box{
    flex:1; background: var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:10px 14px; text-align:center;
  }
  .score-box .label{ font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--text-muted); }
  .score-box .value{ font-family:'Sora', sans-serif; font-weight:800; font-size:1.3rem; }

  .board{
    position:relative;
    width:min(92vw, 360px); height:min(92vw, 360px);
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px;
    display:grid;
    grid-template-columns: repeat(4,1fr);
    grid-template-rows: repeat(4,1fr);
    gap:8px;
    touch-action:none;
  }
  .tile{
    border-radius:12px;
    background: rgba(255,255,255,0.04);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif; font-weight:800;
    font-size:1.5rem;
    transition: background .15s ease;
  }
  [data-theme="light"] .tile{ background: rgba(124,58,237,0.06); }
  .tile.v2{ background:#3a2557; color:#f3e8ff; }
  .tile.v4{ background:#4a2a7a; color:#f3e8ff; }
  .tile.v8{ background:#5b3399; color:#fff; }
  .tile.v16{ background:#6d3dbf; color:#fff; }
  .tile.v32{ background:#7e22ce; color:#fff; }
  .tile.v64{ background:#9333ea; color:#fff; }
  .tile.v128{ background:#a855f7; color:#fff; font-size:1.3rem; }
  .tile.v256{ background:#c026d3; color:#fff; font-size:1.3rem; }
  .tile.v512{ background:#d946ef; color:#fff; font-size:1.3rem; }
  .tile.v1024{ background:#e879f9; color:#3a2557; font-size:1.1rem; }
  .tile.v2048{ background: linear-gradient(135deg,#f0abfc,#e9d5ff); color:#3a2557; font-size:1.1rem; box-shadow:0 0 20px 4px rgba(232,121,249,0.6); }

  .controls{ display:flex; gap:12px; }
  .btn{
    font-family:'Sora', sans-serif; font-weight:700; font-size:0.85rem;
    color: var(--text-primary);
    background: var(--surface);
    border:1px solid var(--border);
    padding:12px 20px; border-radius:14px;
    cursor:pointer;
  }
  .btn:active{ transform: scale(0.96); }
  .hint{ font-size:0.78rem; color: var(--text-muted); text-align:center; max-width:300px; }

  .overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.75);
    display:none; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  .overlay.open{ display:flex; }
  .overlay-card{
    background: var(--black);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px 26px;
    text-align:center;
    max-width:280px;
  }
  .overlay-card h2{ font-family:'Sora', sans-serif; font-size:1.3rem; margin-bottom:8px; }
  .overlay-card p{ color: var(--text-muted); font-size:0.85rem; margin-bottom:20px; }
</style>
</head>
<body>

<header>
  <a class="back" href="game-center.html" aria-label="Kembali">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <svg class="brand-icon" viewBox="0 0 132 56" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="laiGrad" x1="0" y1="0" x2="132" y2="56" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#e5c9fe"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7e22ce"/>
      </linearGradient>
    </defs>
    <rect x="6" y="4" width="14" height="40" rx="6" fill="url(#laiGrad)"/>
    <rect x="6" y="32" width="60" height="12" rx="6" fill="url(#laiGrad)"/>
    <text x="30" y="33" font-family="Sora, sans-serif" font-weight="800" font-size="32" fill="url(#laiGrad)">ai</text>
  </svg>
  <div class="title">Game Center · 2048</div>
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    <span class="knob"></span>
  </button>
</header>

<main>
  <div class="scorebar">
    <div class="score-box"><div class="label">Skor</div><div class="value" id="scoreVal">0</div></div>
    <div class="score-box"><div class="label">Terbaik</div><div class="value" id="bestVal">0</div></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn" id="newGameBtn">Main Baru</button>
  </div>
  <p class="hint">Geser (swipe) di papan buat gerakin ubin, atau pakai tombol panah keyboard. Gabungin angka sama sampai 2048!</p>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="overlayText">Skor akhir: 0</p>
    <button class="btn" id="overlayBtn">Main Lagi</button>
  </div>
</div>

<script>
  var SIZE = 4;
  var grid = new Array(SIZE*SIZE).fill(0);
  var score = 0;
  var best = parseInt(localStorage.getItem('lai_2048_best') || '0', 10);
  var won = false;
  var boardEl = document.getElementById('board');
  var scoreEl = document.getElementById('scoreVal');
  var bestEl = document.getElementById('bestVal');
  var overlay = document.getElementById('overlay');

  function idx(r,c){ return r*SIZE+c; }

  function emptyCells(){
    var cells = [];
    for(var i=0;i<grid.length;i++) if(grid[i]===0) cells.push(i);
    return cells;
  }

  function addRandomTile(){
    var cells = emptyCells();
    if(cells.length===0) return;
    var i = cells[Math.floor(Math.random()*cells.length)];
    grid[i] = Math.random() < 0.9 ? 2 : 4;
  }

  function getRow(r){ var row=[]; for(var c=0;c<SIZE;c++) row.push(grid[idx(r,c)]); return row; }
  function setRow(r,row){ for(var c=0;c<SIZE;c++) grid[idx(r,c)]=row[c]; }
  function getCol(c){ var col=[]; for(var r=0;r<SIZE;r++) col.push(grid[idx(r,c)]); return col; }
  function setCol(c,col){ for(var r=0;r<SIZE;r++) grid[idx(r,c)]=col[r]; }

  function collapseLeft(line){
    var vals = line.filter(function(v){ return v!==0; });
    var result = [];
    var gained = 0;
    for(var i=0;i<vals.length;i++){
      if(vals[i]===vals[i+1]){
        var merged = vals[i]*2;
        result.push(merged);
        gained += merged;
        i++;
      } else {
        result.push(vals[i]);
      }
    }
    while(result.length<SIZE) result.push(0);
    var moved = result.some(function(v,i){ return v!==line[i]; });
    return { line: result, moved: moved, gained: gained };
  }

  function move(direction){
    var moved = false;
    var gained = 0;

    if(direction==='left' || direction==='right'){
      for(var r=0;r<SIZE;r++){
        var row = getRow(r);
        if(direction==='right') row = row.slice().reverse();
        var res = collapseLeft(row);
        var finalRow = direction==='right' ? res.line.slice().reverse() : res.line;
        setRow(r, finalRow);
        if(res.moved) moved = true;
        gained += res.gained;
      }
    } else {
      for(var c=0;c<SIZE;c++){
        var col = getCol(c);
        if(direction==='down') col = col.slice().reverse();
        var res2 = collapseLeft(col);
        var finalCol = direction==='down' ? res2.line.slice().reverse() : res2.line;
        setCol(c, finalCol);
        if(res2.moved) moved = true;
        gained += res2.gained;
      }
    }

    if(moved){
      score += gained;
      if(score>best){ best=score; try{ localStorage.setItem('lai_2048_best', String(best)); }catch(e){} }
      addRandomTile();
      render();
      checkGameState();
    }
  }

  function canMove(){
    if(emptyCells().length>0) return true;
    for(var r=0;r<SIZE;r++){
      for(var c=0;c<SIZE;c++){
        var v = grid[idx(r,c)];
        if(c<SIZE-1 && grid[idx(r,c+1)]===v) return true;
        if(r<SIZE-1 && grid[idx(r+1,c)]===v) return true;
      }
    }
    return false;
  }

  function checkGameState(){
    if(!won && grid.indexOf(2048)!==-1){
      won = true;
      showOverlay('Kamu Menang! 🎉', 'Skor: ' + score + '. Lanjut main atau mulai baru.');
    } else if(!canMove()){
      showOverlay('Game Over', 'Skor akhir: ' + score);
    }
  }

  function showOverlay(title, text){
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlayText').textContent = text;
    overlay.classList.add('open');
  }
  function hideOverlay(){ overlay.classList.remove('open'); }

  function render(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
    boardEl.innerHTML = '';
    for(var i=0;i<grid.length;i++){
      var v = grid[i];
      var tile = document.createElement('div');
      tile.className = 'tile' + (v ? ' v' + v : '');
      tile.textContent = v || '';
      boardEl.appendChild(tile);
    }
  }

  function resetGame(){
    grid = new Array(SIZE*SIZE).fill(0);
    score = 0;
    won = false;
    hideOverlay();
    addRandomTile();
    addRandomTile();
    render();
  }

  document.getElementById('newGameBtn').addEventListener('click', resetGame);
  document.getElementById('overlayBtn').addEventListener('click', resetGame);

  document.addEventListener('keydown', function(e){
    var map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  });

  var touchStartX, touchStartY;
  boardEl.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  boardEl.addEventListener('touchend', function(e){
    if(touchStartX===undefined) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 24){ touchStartX=undefined; return; }
    if(Math.abs(dx) > Math.abs(dy)){ move(dx>0 ? 'right' : 'left'); }
    else { move(dy>0 ? 'down' : 'up'); }
    touchStartX = undefined;
  }, {passive:true});

  var themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('lai_theme', next); }catch(e){}
  });

  resetGame();
</script>

</body>
</html>
