<!DOCTYPE html>
<html lang="id">
<head>
<script>
  (function(){
    var t = localStorage.getItem('lai_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Lorong Kilat — L.ai Game Center</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0d0818; --purple-dark: #1f1238;
    --violet: #a855f7; --violet-light: #d8b4fe; --glow: rgba(168,85,247,0.45);
    --text-primary: #f7f3fc; --text-muted: #b6a6d1;
    --border: rgba(192,132,252,0.22);
    --header-bg: rgba(13,8,24,0.5);
    --surface: rgba(255,255,255,0.05);
  }
  [data-theme="light"]{
    --black: #ffffff; --purple-dark: #f6f1fc;
    --violet: #7c3aed; --violet-light: #9333ea; --glow: rgba(124,58,237,0.16);
    --text-primary: #1c1330; --text-muted: #6b5d85;
    --border: rgba(124,58,237,0.15);
    --header-bg: rgba(255,255,255,0.7);
    --surface: rgba(124,58,237,0.06);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    color: var(--text-primary);
    background: linear-gradient(160deg, var(--black) 0%, var(--purple-dark) 45%, var(--black) 100%);
    display:flex; flex-direction:column; height:100vh; height:100dvh;
  }
  header{
    display:flex; align-items:center; gap:12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    flex-shrink:0;
    z-index:5;
  }
  .back{
    width:32px; height:32px; border-radius:10px;
    border:1px solid var(--border); background: var(--surface);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted); text-decoration:none; flex-shrink:0;
  }
  .back svg{ width:15px; height:15px; }
  .title{ font-family:'Sora', sans-serif; font-weight:700; font-size:0.9rem; flex:1; }
  .score-live{ font-family:'Sora', sans-serif; font-weight:800; font-size:1rem; color: var(--violet-light); }

  .stage{ position:relative; flex:1; overflow:hidden; }
  canvas{ display:block; width:100%; height:100%; }

  .overlay{
    position:absolute; inset:0; background: rgba(0,0,0,0.75);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; text-align:center; padding:20px;
  }
  .overlay h2{ font-family:'Sora', sans-serif; font-size:1.4rem; }
  .overlay p{ color: var(--text-muted); font-size:0.85rem; max-width:260px; line-height:1.5; }
  .btn{
    font-family:'Sora', sans-serif; font-weight:700; font-size:0.88rem;
    color:#fff; background: linear-gradient(135deg,#7e22ce,#a855f7);
    border:none; padding:13px 26px; border-radius:14px; cursor:pointer;
  }
  .btn:active{ transform: scale(0.96); }
  .hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:0.75rem; color: var(--text-muted); pointer-events:none; }
</style>
</head>
<body>

<header>
  <a class="back" href="game-center.html" aria-label="Kembali">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="title">Lorong Kilat</div>
  <div class="score-live" id="liveScore">0</div>
</header>

<div class="stage" id="stage">
  <canvas id="canvas"></canvas>
  <div class="hint">Geser kiri/kanan buat pindah lajur, geser atas buat lompat</div>
  <div class="overlay" id="startOverlay">
    <h2>Lorong Kilat</h2>
    <p>Lari terus, hindari rintangan di 3 lajur. Geser kiri/kanan buat pindah lajur, geser ke atas buat lompat.</p>
    <button class="btn" id="startBtn">Mulai</button>
  </div>
</div>

<script>
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var liveScore = document.getElementById('liveScore');
  var startOverlay = document.getElementById('startOverlay');
  var startBtn = document.getElementById('startBtn');

  var W, H, laneW;
  function resize(){
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    laneW = W / 3;
  }
  window.addEventListener('resize', resize);
  resize();

  var LANES = [0,1,2];
  var player = { lane: 1, y: 0, vy: 0, jumping: false, w: 34, h: 34 };
  var obstacles = [];
  var running = false;
  var speed = 6;
  var spawnTimer = 0;
  var score = 0;
  var groundY;

  function reset(){
    player.lane = 1;
    player.y = 0;
    player.vy = 0;
    player.jumping = false;
    obstacles = [];
    speed = 6;
    spawnTimer = 0;
    score = 0;
    running = true;
    startOverlay.style.display = 'none';
  }

  function laneX(lane){ return lane*laneW + laneW/2; }

  function spawnObstacle(){
    var lane = Math.floor(Math.random()*3);
    obstacles.push({ lane: lane, z: 0, passed:false });
  }

  function update(){
    groundY = H - 70;
    if(!running) return;

    spawnTimer++;
    var spawnEvery = Math.max(35, 70 - Math.floor(score/8));
    if(spawnTimer > spawnEvery){
      spawnTimer = 0;
      spawnObstacle();
    }

    speed = 6 + score*0.03;

    for(var i=obstacles.length-1;i>=0;i--){
      obstacles[i].z += speed;
      if(obstacles[i].z > H+50){ obstacles.splice(i,1); continue; }
      if(!obstacles[i].passed && obstacles[i].z > groundY){
        obstacles[i].passed = true;
        score++;
      }
    }

    if(player.jumping){
      player.vy += 1.1;
      player.y += player.vy;
      if(player.y >= 0){ player.y = 0; player.vy = 0; player.jumping = false; }
    }

    // collision
    for(var j=0;j<obstacles.length;j++){
      var o = obstacles[j];
      if(o.lane === player.lane && Math.abs(o.z - groundY) < 26 && player.y > -30){
        gameOver();
        break;
      }
    }

    liveScore.textContent = score;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // lane dividers
    ctx.strokeStyle = 'rgba(168,85,247,0.15)';
    ctx.lineWidth = 2;
    for(var l=1;l<3;l++){
      ctx.beginPath();
      ctx.moveTo(l*laneW, 0);
      ctx.lineTo(l*laneW, H);
      ctx.stroke();
    }

    // ground line
    ctx.strokeStyle = 'rgba(168,85,247,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, groundY+30);
    ctx.lineTo(W, groundY+30);
    ctx.stroke();

    // obstacles
    for(var i=0;i<obstacles.length;i++){
      var o = obstacles[i];
      var size = 20 + (o.z/H)*30;
      var grad = ctx.createLinearGradient(0,o.z-size,0,o.z+size);
      grad.addColorStop(0,'#d946ef');
      grad.addColorStop(1,'#7e22ce');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(laneX(o.lane)-size/2, o.z-size, size, size, 8);
      ctx.fill();
    }

    // player
    var px = laneX(player.lane);
    var py = groundY + player.y;
    var pgrad = ctx.createLinearGradient(0,py-player.h,0,py+player.h);
    pgrad.addColorStop(0,'#e5c9fe');
    pgrad.addColorStop(1,'#a855f7');
    ctx.fillStyle = pgrad;
    ctx.beginPath();
    ctx.roundRect(px-player.w/2, py-player.h, player.w, player.h, 10);
    ctx.fill();
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    running = false;
    startOverlay.innerHTML =
      '<h2>Game Over</h2>' +
      '<p>Skor kamu: ' + score + '</p>' +
      '<button class="btn" id="startBtn2">Main Lagi</button>';
    startOverlay.style.display = 'flex';
    document.getElementById('startBtn2').addEventListener('click', reset);
  }

  startBtn.addEventListener('click', reset);

  document.addEventListener('keydown', function(e){
    if(!running) return;
    if(e.key === 'ArrowLeft') player.lane = Math.max(0, player.lane-1);
    if(e.key === 'ArrowRight') player.lane = Math.min(2, player.lane+1);
    if(e.key === 'ArrowUp' && !player.jumping){ player.jumping = true; player.vy = -16; }
  });

  var touchStartX, touchStartY;
  stage.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if(!running || touchStartX===undefined) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if(Math.abs(dx) > Math.abs(dy)){
      if(dx>0) player.lane = Math.min(2, player.lane+1);
      else player.lane = Math.max(0, player.lane-1);
    } else if(dy < 0 && !player.jumping){
      player.jumping = true; player.vy = -16;
    }
    touchStartX = undefined;
  }, {passive:true});

  loop();
</script>

</body>
</html>
